<div class="page-narrow auth-page">
  <app-page-header [title]="'auth.forgot.title' | transloco" />
  <mat-card class="auth-card">
    <mat-card-content>
      @if (sent()) {
        <p>{{ 'auth.forgot.sent' | transloco }}</p>
      } @else {
        <form class="stack" [formGroup]="form" (ngSubmit)="submit()">
          <p class="muted">{{ 'auth.forgot.intro' | transloco }}</p>
          <mat-form-field>
            <mat-label>{{ 'auth.email' | transloco }}</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email" />
            <mat-error>{{ form.controls.email | fieldError }}</mat-error>
          </mat-form-field>
          @if (error()) {
            <p class="form-error" role="alert">{{ error() }}</p>
          }
          <button mat-flat-button type="submit" [disabled]="submitting()">{{ 'auth.forgot.submit' | transloco }}</button>
        </form>
      }
      <div class="card-links"><a routerLink="/login">{{ 'auth.forgot.back' | transloco }}</a></div>
    </mat-card-content>
  </mat-card>
</div>
